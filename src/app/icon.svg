<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Favicon: la misma estrella del nav, sin fondo.

    Un SVG puede consultar el tema del navegador, cosa que un PNG o un .ico no.
    Hace falta: en tinta sobre pestanas claras se lee perfecta, pero sobre una
    pestana oscura desaparecia — estrella #0e0e0e sobre chrome #35363a. Aca la
    figura cambia a crema cuando el sistema esta en oscuro.

    La chispa se queda roja en los dos temas: es el acento de marca y contrasta
    contra cualquiera de los dos fondos.

    `currentColor` no sirve para esto: el navegador no le pasa un color al
    favicon, asi que la media query es la unica via.
  -->
  <style>
    .figura { fill: #0e0e0e; }
    @media (prefers-color-scheme: dark) {
      .figura { fill: #f4f1ea; }
    }
  </style>
  <path class="figura" d="M 50 4 C 52 32, 68 48, 96 50 C 68 52, 52 68, 50 96 C 48 68, 32 52, 4 50 C 32 48, 48 32, 50 4 Z"/>
  <path fill="#e53935" d="M 82 14 C 83 19, 87 23, 92 24 C 87 25, 83 29, 82 34 C 81 29, 77 25, 72 24 C 77 23, 81 19, 82 14 Z"/>
</svg>
